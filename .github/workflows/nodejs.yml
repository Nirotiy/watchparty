name: WatchParty CI

on:
  push:
    branches: [master, nextjs-main]
  pull_request:
    branches: [master, nextjs-main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend types
        run: npm run typecheckServer

      - name: Test backend
        run: npm test

      - name: Build legacy bundle while it remains in the repository
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

      - name: Install Next.js dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js frontend
        working-directory: web
        run: npm run build

      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag watchparty-backend:ci .

      - name: Build frontend image
        run: docker build --file Dockerfile.frontend --tag watchparty-frontend:ci .
