[package]
name = "watchparty-desktop"
version = "0.1.0"
edition = "2021"
description = "WatchParty desktop client with an isolated libmpv playback surface"
default-run = "watchparty-native-sidecar"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
zeroize = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
url = "2"
urlencoding = "2"

[dev-dependencies]
rcgen = "0.13.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[lib]
name = "watchparty_desktop"
path = "src/lib.rs"

[[bin]]
name = "watchparty-native-sidecar"
path = "src/bin/desktop_sidecar.rs"
