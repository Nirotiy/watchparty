[package]
name = "watchparty-desktop"
version = "0.1.0"
edition = "2021"
description = "WatchParty desktop native session core (Gate 2: no video surface, no libmpv yet)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[lib]
name = "watchparty_desktop"
path = "src/lib.rs"
