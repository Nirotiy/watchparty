tion:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--cyan)}.nav .spacer{height:208px}.connection{font-size:11px;color:#999;padding:12px 11px;border-top:1px solid #303030}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:7px}.content{flex:1;min-width:0;padding:23px 27px;overflow:auto}.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #303030;padding-bottom:13px;margin-bottom:18px}.topline h3{font-size:18px;margin:0}.hint{color:#999;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel{border:1px solid #383838;background:#191919;border-radius:5px;padding:15px}.panel h4{margin:0 0 7px;font-size:14px}.panel p{color:#aaa;font-size:12px;margin:0 0 13px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid #303030;padding:11px 0;font-size:13px}.row:first-child{border-top:0}.mono{font-family:ui-monospace,Consolas,monospace}.btn{height:34px;border:1px solid #505050;border-radius:4px;background:#252525;color:#fff;padding:0 14px;font:13px inherit;cursor:pointer}.btn:hover{background:#333}.btn.primary{background:var(--cyan);color:#001018;border-color:var(--cyan);font-weight:650}.btn.subtle{background:transparent;border-color:transparent;color:#bbb}.field{height:34px;border:1px solid #555;border-bottom:2px solid #aaa;border-radius:3px;background:#1a1a1a;color:#fff;padding:0 10px;font:13px inherit}.resume{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-bottom:12px}.resume-main{min-height:174px;background:#1c1c1c;border:1px solid #424242;padding:17px;display:flex;flex-direction:column;justify-content:space-between}.resume-title{font-size:22px;font-weight:650}.progress{height:3px;background:#3d3d3d;margin:10px 0 0}.progress i{display:block;width:62%;height:100%;background:var(--cyan)}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status div{border-top:1px solid #3b3b3b;padding-top:9px;color:#aaa;font-size:12px}.status b{display:block;color:#fff;font-size:16px;margin-bottom:2px}.video{height:305px;background:#050505;display:grid;place-items:center;color:#777;border:1px solid #242424;position:relative}.video:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--cyan) 62%,#3b3b3b 62%)}.overlaybar{display:flex;align-items:center;gap:10px;background:#0b0b0b;border-top:1px solid #303030;padding:9px 12px;color:#bbb;font-size:12px}.push{margin-left:auto}.drawer{width:282px;border-left:1px solid #3a3a3a;background:#181818;padding:15px}.queue{border-top:1px solid #363636;padding:10px 0;font-size:12px}.queue.current{color:var(--cyan)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.fact{border-top:1px solid #343434;padding-top:9px;color:#aaa;font-size:12px}.fact strong{display:block;color:#fff;margin-bottom:3px}.merge{margin-top:42px;border-top:1px solid #333;padding-top:18px;max-width:94ch}.merge h3{font-size:16px;margin-bottom:8px}.merge p{color:#aaa}.merge code{color:var(--cyan);font-family:ui-monospace,Consolas,monospace}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2b2b2b;border:1px solid #555;padding:9px 14px;border-radius:4px;font-size:12px;display:none}.toast.show{display:block}@media(max-width:900px){.page{padding:20px 12px}.app{height:650px}.nav{width:185px}.grid{grid-template-columns:1fr 1fr}.resume{grid-template-columns:1fr}.drawer{width:240px}}@media(max-width:650px){.nav{width:62px}.nav .logo{font-size:0}.nav .logo em{font-size:14px}.nav button{font-size:0;text-align:center;padding:0}.nav button:after{content:"•";font-size:16px}.content{padding:17px 13px}.grid,.facts,.status{grid-template-columns:1fr}.drawer{display:none}}

/* Standalone A1 canvas. Keep the selected composition while fitting the viewport. */
html,body{min-height:100%;letter-spacing:0}
body{background:#000}
.app{height:100dvh;min-height:540px;border:0;border-radius:0;box-shadow:none}
.titlebar{flex-shrink:0}
.nav{display:flex;flex-direction:column}
.nav button{flex-shrink:0}
.nav .spacer{height:auto;flex:1}
.field{width:100%;min-width:0;max-width:100%;margin-bottom:8px}
.btn{font-family:inherit;font-size:13px;max-width:100%}
.topline{gap:12px;flex-wrap:wrap}
.resume-main{gap:16px}
.panel,.resume-main,.status>div{min-width:0}
.mono{overflow-wrap:anywhere}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(max-width:650px){.connection{padding:12px 0;overflow-wrap:anywhere}.nav button{font-size:0}.status{grid-template-columns:repeat(3,minmax(0,1fr))}.content{overflow-x:hidden}.resume-title{font-size:20px}}

<div class="app"><div class="titlebar"><span class="brand">WatchParty</span><span class="window-actions"><span>—</span><span>□</span><span>×</span></span></div><div class="shell"><nav class="nav"><div class="logo"><em>W</em> WatchParty</div><button class="active">⌂　首页</button><button>▣　媒体库</button><button>▶　当前房间</button><button>⚙　设置</button><div class="spacer"></div><div class="connection"><span class="dot"></span>已连接<br><span class="mono">/room-74bcde5d</span></div></nav><div class="content"><div class="topline"><h3>准备继续观看</h3><span class="hint">上次活动 · 18:24</span></div><div class="resume"><div class="resume-main"><div><div class="hint">正在恢复的房间</div><div class="resume-title">雾都夜行 EP07</div><div class="hint">房间 <span class="mono">/room-74bcde5d</span> · 18:24 / 24:02</div><div class="progress"><i></i></div></div><div><button class="btn primary" data-toast="已进入房间">继续观看</button><button class="btn subtle" data-toast="已打开更多操作">更多</button></div></div><div class="panel"><h4>连接状态</h4><div class="status"><div><b>38 ms</b>同步延迟</div><div><b style="color:var(--lime)">正常</b>服务状态</div><div><b>2</b>在线成员</div></div><div class="row"><span>深链房间</span><span style="color:var(--cyan)">即将加入</span></div></div></div><div class="grid"><div class="panel"><h4>创建房间</h4><p>创建后你将成为房主。</p><button class="btn" data-toast="创建房间 · 操作已提交">新建房间</button></div><div class="panel"><h4>加入房间</h4><p>输入房号或交接码。</p><input class="field" placeholder="房号 / PIN"><button class="btn" data-toast="加入房间 · 操作已提交">加入</button></div><div class="panel"><h4>媒体库</h4><p>浏览本地目录与已配置站点。</p><button class="btn" data-toast="媒体库 · 即将打开">浏览媒体</button></div></div></div></div></div>
